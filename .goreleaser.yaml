version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...
    - go run ./cmd/release-sign -mode prepare

builds:
  - id: expose
    main: ./cmd/expose
    binary: expose
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/koltyakov/expose/internal/cli.Version={{.Version}} -X 'github.com/koltyakov/expose/internal/releasesign.KeysJSON={{ .Env.RELEASE_SIGNING_PUBLIC_KEYS }}'

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [ "zip" ]
    files:
      - README.md
      - LICENSE
      - docs/**
      - assets/**

checksum:
  name_template: "checksums.txt"

# Sign the final checksum bytes and bind them to this repository and exact tag.
# Private key material is read only from RELEASE_SIGNING_PRIVATE_KEY.
signs:
  - id: checksums
    cmd: go
    signature: "${artifact}.sig"
    args:
      - run
      - ./cmd/release-sign
      - -mode=sign
      - -tag={{ .Tag }}
      - -manifest=${artifact}
      - -signature=${signature}
    artifacts: checksum

release:
  extra_files:
    - glob: tmp/release-installers/install.sh
    - glob: tmp/release-installers/install.ps1
  draft: false
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: Features
      regexp: "^.*?(feat|feature)(\\(.+\\))??!?:.+$"
      order: 0
    - title: Bug fixes
      regexp: "^.*?(fix|bug)(\\(.+\\))??!?:.+$"
      order: 1
    - title: Others
      order: 999
